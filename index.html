<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presensi Latihan AKD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F5F6F1;--sf:#FFFFFF;--ink:#17233A;--mut:#5B6577;--line:#D8DCD2;--pri:#1F6B43;--onpri:#FFFFFF;--hadir:#1F6B43;--ijin:#2B5FA8;--sakit:#E8A317;--ket:#6B7280;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1724;--sf:#182234;--ink:#EDF0F5;--mut:#9AA5B8;--line:#2B3850;--pri:#4FB27A;--onpri:#0B1A12;--hadir:#4FB27A;--ijin:#6F9FE6;--sakit:#F2B84B;--ket:#9AA5B8;--bad:#F2877F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1724;--sf:#182234;--ink:#EDF0F5;--mut:#9AA5B8;--line:#2B3850;--pri:#4FB27A;--onpri:#0B1A12;--hadir:#4FB27A;--ijin:#6F9FE6;--sakit:#F2B84B;--ket:#9AA5B8;--bad:#F2877F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Barlow",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0;line-height:1.1}
h1{font-size:clamp(28px,6.5vw,42px);letter-spacing:.01em}
h2{font-size:24px;margin-bottom:12px}
.sub{color:var(--mut);margin:6px 0 18px}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px}
nav button{flex:1;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:12px 2px;font:600 14px "Barlow",sans-serif;color:var(--mut);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pri)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,label:focus-within{outline:3px solid var(--ijin);outline-offset:2px}
section{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
input[type=text],input[type=date],input[type=time],input[type=month],select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;font:400 16px "Barlow",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
textarea{min-height:92px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}
.day{color:var(--pri);font-weight:600;margin:-6px 0 12px;min-height:24px}
.ath{padding:12px 0;border-top:1px solid var(--line)}
.ath:first-of-type{border-top:0}
.ath b{display:block;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 2px;border:1.5px solid var(--line);border-radius:6px;font-size:14px;font-weight:600;color:var(--mut)}
.seg input:checked+span{color:#fff;border-color:transparent}
.seg .Hadir input:checked+span{background:var(--hadir);color:var(--onpri)}
.seg .Ijin input:checked+span{background:var(--ijin);color:#fff}
.seg .Sakit input:checked+span{background:var(--sakit);color:#17233A}
.seg .Keterangan input:checked+span{background:var(--ket);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--ijin);outline-offset:2px}
.note{margin-top:8px}
.btn{font:600 16px "Barlow",sans-serif;padding:11px 18px;border-radius:6px;border:1.5px solid var(--pri);background:var(--pri);color:var(--onpri);cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.bad{background:none;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
.prev{max-width:100%;max-height:220px;border-radius:8px;margin-top:8px;display:block}
.empty{color:var(--mut);padding:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor}
.c-Hadir{color:var(--hadir)}.c-Ijin{color:var(--ijin)}.c-Sakit{color:#B07800}.c-Keterangan{color:var(--ket)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .c-Sakit{color:var(--sakit)}}
:root[data-theme="dark"] .c-Sakit{color:var(--sakit)}
details{border:1px solid var(--line);border-radius:10px;background:var(--sf);margin-bottom:12px}
summary{cursor:pointer;padding:14px 16px;list-style:none}
summary::-webkit-details-marker{display:none}
.dt{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:21px}
.mt{color:var(--mut);font-size:14px}
.det{padding:0 16px 16px;border-top:1px solid var(--line)}
.det h3{font-size:17px;margin:14px 0 4px}
.det p{margin:0;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;font-weight:600}
.add{display:flex;gap:8px}.add input{margin:0}
ul.l{list-style:none;margin:12px 0 0;padding:0}
ul.l li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
textarea.out{margin-top:10px;font-size:14px;min-height:150px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:5}
.tw{overflow-x:auto}.rk th{font-size:13px;text-align:center;padding:6px 4px;color:var(--mut)}.rk th:first-child{text-align:left}.rk td{text-align:center;font-weight:400}.rk td:first-child{text-align:left;font-weight:600}.rk td:last-child{text-align:center;font-weight:600}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.toast{animation:in .2s}@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}}
/* tampilan dojo */
:root{--bg:#FFF1A8;--sf:#FFFFFF;--ink:#2B2626;--mut:#6A5F4D;--line:#E3D9A4;--pri:#E3202B;--onpri:#FFFFFF;--hadir:#1B8A4B;--ijin:#2563C9;--sakit:#F2A100;--ket:#6B6B6B;--bad:#C4121C;--edge:#2B2626;--shd:#2B2626}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1A1A;--sf:#2B2626;--ink:#FFF4C2;--mut:#CDBF98;--line:#4A4242;--pri:#FFD500;--onpri:#2B2626;--hadir:#4FD08A;--ijin:#7FB0FF;--sakit:#FFB938;--ket:#B5ADA0;--bad:#FF8A90;--edge:#FFD500;--shd:#E3202B}}
:root[data-theme="dark"]{--bg:#1D1A1A;--sf:#2B2626;--ink:#FFF4C2;--mut:#CDBF98;--line:#4A4242;--pri:#FFD500;--onpri:#2B2626;--hadir:#4FD08A;--ijin:#7FB0FF;--sakit:#FFB938;--ket:#B5ADA0;--bad:#FF8A90;--edge:#FFD500;--shd:#E3202B}
body{font:600 16px/1.5 "Nunito",system-ui,sans-serif;background-image:radial-gradient(rgba(227,32,43,.14) 1.6px,transparent 1.6px);background-size:18px 18px}
h1,h2,h3,.dt{font-family:"Lilita One","Arial Black",sans-serif;font-weight:400;letter-spacing:.02em}
h2{color:var(--pri)}
.dt{font-size:22px;color:var(--ink)}
.hero{display:flex;align-items:center;gap:14px;background:#E3202B;border:3px solid #2B2626;border-radius:18px;box-shadow:5px 5px 0 var(--shd);padding:14px 16px;margin:34px 0 22px}
.hero img{width:84px;height:auto;flex:none;margin:-34px 0 -6px}
.hero h1{color:#FFD500;font-size:clamp(25px,6.2vw,38px);line-height:1.08;text-shadow:2px 2px 0 #2B2626,-2px 2px 0 #2B2626,2px -2px 0 #2B2626,-2px -2px 0 #2B2626,0 3px 0 #2B2626}
.hero .sub{color:#fff;margin:8px 0 0;font-weight:700;font-size:15px}
nav{gap:8px;border-bottom:0;margin-bottom:22px}
nav button{border:3px solid var(--edge);border-radius:12px;margin:0;background:var(--sf);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:800;font-size:13.5px;line-height:1.2;padding:10px 3px;box-shadow:3px 3px 0 var(--shd)}
nav button[aria-selected="true"]{background:var(--pri);color:var(--onpri);border-color:var(--edge);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shd)}
section,details{border:3px solid var(--edge);border-radius:16px;box-shadow:5px 5px 0 var(--shd)}
section{padding:18px;margin-bottom:20px}
details{margin-bottom:20px}
.det{border-top:2px dashed var(--line)}
label.f{font-weight:800}
input[type=text],input[type=date],input[type=time],input[type=month],select,textarea{border:2.5px solid var(--edge);border-radius:10px;font-family:"Nunito",system-ui,sans-serif;font-weight:600}
.btn{font-family:"Nunito",system-ui,sans-serif;font-weight:800;border:3px solid var(--edge);border-radius:12px;box-shadow:3px 3px 0 var(--shd)}
.btn:active,nav button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shd)}
.btn.ghost{background:var(--sf);color:var(--ink);border-color:var(--edge)}
.btn.bad{background:var(--sf);color:var(--bad);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.seg span{border:2.5px solid var(--edge);border-radius:10px;font-weight:800;color:var(--ink);background:var(--sf)}
.seg input:checked+span{border-color:var(--edge);box-shadow:2px 2px 0 var(--shd)}
.ath{border-top:2px dashed var(--line)}
.chip{border-width:2.5px;font-weight:800;background:var(--sf)}
.day{font-weight:800}
.rk th{border-bottom:3px solid var(--edge)}
.rk.rp td:last-child{font-weight:600;text-align:left}
@media(max-width:520px){.seg{grid-template-columns:1fr 1fr}}
.note{min-height:64px;font-size:15px}
.stat{font-size:14px;font-weight:800;padding:8px 12px;border:2.5px solid var(--edge);border-radius:10px;margin:-8px 0 18px;background:var(--sf);color:var(--ink)}
.stat.ok{border-color:var(--hadir);color:var(--hadir)}.stat.w{background:#FFD500;color:#2B2626;border-color:#2B2626}.stat.bad{border-color:var(--bad);color:var(--bad)}
.toast{border:2px solid var(--edge);font-weight:800}
</style>
</head>

<label class="f">Jam mulai<input type="time" id="jm" value="16:00"></label>
<label class="f">Jam selesai<input type="time" id="js" value="18:00"></label>
</div>
<div class="day" id="hari"></div>
</section>
<section>
<div class="bar"><h2 style="margin:0">Kehadiran atlet</h2><span class="sp"></span><button class="btn ghost sm" id="semua" type="button">Semua hadir</button></div>
<div id="roster"></div>
</section>
<section>
<label class="f">Materi latihan<textarea id="materi" placeholder="Contoh: pemanasan, teknik dasar, latihan fisik"></textarea></label>
<label class="f">Evaluasi<textarea id="evaluasi" placeholder="Catatan perkembangan atlet dan hal yang perlu diperbaiki"></textarea></label>
<label class="f">Foto latihan<input type="file" id="foto" accept="image/*"></label>
<img class="prev" id="prev" alt="Pratinjau foto" hidden>
</section>
<div class="bar"><button class="btn" id="simpan" type="button">Simpan presensi</button><button class="btn ghost" id="reset" type="button">Kosongkan formulir</button></div>
</div>

<div id="v-riwayat" hidden></div>
<div id="v-rekap" hidden></div>

<div id="v-atlet" hidden>
<section>
<h2>Daftar atlet</h2>
<form class="add" id="fAdd" onsubmit="return false"><input type="text" id="nm" placeholder="Nama atlet" aria-label="Nama atlet"><button class="btn" id="tambah" type="button">Tambah</button></form>
<ul class="l" id="daftar"></ul>
</section>
<section>
<h2>Daftar pelatih</h2>
<form class="add" onsubmit="return false"><input type="text" id="np" placeholder="Nama pelatih" aria-label="Nama pelatih"><button class="btn" id="tambahP" type="button">Tambah</button></form>
<ul class="l" id="daftarP"></ul>
</section>
<section id="imp" hidden><h2>Pindahkan data lama</h2><p class="mt" id="impT"></p><button class="btn" id="impB" type="button">Impor ke data bersama</button></section>
</div>
<p class="mt">Gunakan tombol Salin rekap untuk membagikan hasilnya, misalnya ke grup WhatsApp.</p>
</div>

<script>
(function(){
var K="presensi-latihan-v1",ST=["Hadir","Ijin","Sakit","Keterangan"];
function lbl(k){return k==="Keterangan"?"Tanpa Keterangan":k}
var PH={Hadir:"Catatan perkembangan atlet hari ini",Ijin:"Ijin apa? (mis. acara keluarga, ujian sekolah)",Sakit:"Sakit apa? (mis. demam, cedera lutut)",Keterangan:"Catatan untuk atlet ini (opsional)"};
var db={atlet:[],sesi:[],pelatih:"",pelatihList:[]},cur={},foto="";
var remote=null,mode="load",loc=null,fotoCache={},curTab="catat",PK="presensi-pref-v1",CM={atlet:"atlet",pelatih:"pelatihList",sesi:"sesi"};
function readLoc(){try{var r=localStorage.getItem(K);return r?JSON.parse(r):null}catch(e){return null}}
function readPref(){try{var r=localStorage.getItem(PK);return r?JSON.parse(r).pelatih||"":""}catch(e){return""}}
function save(){try{if(remote)localStorage.setItem(PK,JSON.stringify({pelatih:db.pelatih}));else localStorage.setItem(K,JSON.stringify(db));return true}catch(e){toast("Penyimpanan penuh. Hapus sesi lama atau gunakan foto lebih kecil.");return false}}
function setStat(k){var e=$("stat"),M={load:["Menyambung ke data bersama...","w"],ok:["Data bersama aktif. Semua pelatih melihat data yang sama.","ok"],slow:["Belum tersambung ke data bersama. Data mungkin belum terbaru.","w"],err:["Koneksi data bersama terputus. Muat ulang halaman.","bad"],local:["Mode perangkat ini: data hanya tersimpan di browser ini dan tidak dibagikan.","w"]};e.textContent=M[k][0];e.className="stat "+M[k][1];e.hidden=false}
function fail(e){if(!e||e.code==="local_full")return;toast(e.code==="wait"?"Masih menyambung ke data bersama. Coba lagi sebentar lagi.":"Gagal menyimpan ke data bersama. Pastikan Anda masuk dengan izin Kontributor atau Editor.")}
function put(coll,obj){
if(mode==="load")return Promise.reject({code:"wait"});
if(remote){var d=Object.assign({},obj);delete d.id;return remote.doc(coll+"/"+obj.id).set(d)}
var k=CM[coll],a=db[k],old=a.slice(),i=a.findIndex(function(x){return x.id===obj.id});
if(i<0){if(coll==="sesi")a.unshift(obj);else a.push(obj)}else a[i]=obj;
if(!save()){db[k]=old;return Promise.reject({code:"local_full"})}
refresh(coll);return Promise.resolve()}
function rm(coll,id){
if(mode==="load")return Promise.reject({code:"wait"});
if(remote){var p=remote.doc(coll+"/"+id).delete();if(coll==="sesi")p=p.then(function(){return remote.doc("foto/"+id).delete().catch(function(){})});return p}
var k=CM[coll];db[k]=db[k].filter(function(x){return x.id!==id});save();refresh(coll);return Promise.resolve()}
function refresh(c){
if(c==="atlet"){if(curTab==="catat")renderRoster();if(curTab==="atlet")renderAtlet()}
if(c==="pelatih"){renderPelatihSel();if(curTab==="atlet")renderPelatih()}
if(c==="sesi"){if(curTab==="riwayat")renderRiwayat();if(curTab==="rekap")renderRekap()}}
function getFoto(id){if(fotoCache[id])return Promise.resolve(fotoCache[id]);if(!remote)return Promise.resolve(null);
return remote.doc("foto/"+id).get().then(function(sn){var u=sn.exists?sn.data().data:null;if(u)fotoCache[id]=u;return u},function(){return null})}
function ensureFoto(id){var im=document.querySelector('img[data-fid="'+id+'"]');if(!im||!im.hidden)return;getFoto(id).then(function(u){if(u){im.src=u;im.hidden=false}})}
function useLocal(){remote=null;mode="local";if(loc)Object.assign(db,loc);db.pelatihList=db.pelatihList||[];db.pelatih=readPref()||(loc&&loc.pelatih)||"";setStat("local");renderPelatihSel();renderRoster()}
async function initDb(){
setStat("load");var d=null;
try{for(var i=0;i<30&&!window.claude;i++)await new Promise(function(r){setTimeout(r,100)});d=window.claude?await window.claude.use("db"):null}catch(e){}
if(!d){useLocal();return}
remote=d;mode="shared";db.atlet=[];db.pelatihList=[];db.sesi=[];
var got=0,tm=setTimeout(function(){if(!got)setStat("slow")},10000);
[["atlet","atlet"],["pelatih","pelatihList"],["sesi","sesi"]].forEach(function(p){
remote.collection(p[0]).onSnapshot(function(snap){got=1;clearTimeout(tm);setStat("ok");
var arr=snap.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o});
arr.sort(p[0]==="sesi"?function(a,b){return a.tgl<b.tgl?1:a.tgl>b.tgl?-1:(b.ts||0)-(a.ts||0)}:function(a,b){return String(a.nama).localeCompare(String(b.nama))});
db[p[1]]=arr;refresh(p[0])},function(){setStat("err")})});
renderImport()}
function renderImport(){var s=$("imp"),n=loc?(loc.atlet||[]).length+(loc.sesi||[]).length+(loc.pelatihList||[]).length:0;
if(mode!=="shared"||!n){s.hidden=true;return}
$("impT").textContent="Ditemukan data lama di browser ini: "+(loc.atlet||[]).length+" atlet, "+(loc.pelatihList||[]).length+" pelatih, "+(loc.sesi||[]).length+" sesi latihan. Impor agar masuk ke data bersama.";s.hidden=false}
$("impB").onclick=async function(){var b=this;b.disabled=true;
try{var jobs=[];
(loc.atlet||[]).forEach(function(a,i){jobs.push(["atlet",a.id,{nama:a.nama,ts:i}])});
(loc.pelatihList||[]).forEach(function(a,i){jobs.push(["pelatih",a.id,{nama:a.nama,ts:i}])});
(loc.sesi||[]).forEach(function(x,i){var d=Object.assign({},x),f=d.foto;delete d.foto;delete d.id;d.ts=d.ts||Date.now()-i;
if(f&&f.length<240000){jobs.push(["foto",x.id,{data:f}]);d.hasFoto=true}jobs.push(["sesi",x.id,d])});
for(var i=0;i<jobs.length;i++)await remote.doc(jobs[i][0]+"/"+jobs[i][1]).set(jobs[i][2]);
try{localStorage.removeItem(K)}catch(e){}loc=null;toast("Data lama berhasil diimpor.");renderImport()}catch(e){fail(e)}
b.disabled=false};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(t){var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function tglPanjang(s){if(!s)return"";var d=new Date(s+"T00:00:00");return d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function jam(s){return(s||"").replace(":",".")}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function tab(n){curTab=n;["catat","riwayat","rekap","atlet"].forEach(function(t){$("v-"+t).hidden=t!==n});
document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===n)});
if(n==="riwayat")renderRiwayat();if(n==="rekap")renderRekap();if(n==="atlet"){renderAtlet();renderPelatih();renderImport()}if(n==="catat")renderRoster()}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab(b.dataset.tab)}});

function renderRoster(){
var el=$("roster");
if(!db.atlet.length){el.innerHTML='<p class="empty">Belum ada atlet. Tambahkan dulu di tab Daftar atlet.</p>';return}
el.innerHTML=db.atlet.map(function(a){
var c=cur[a.id]||(cur[a.id]={s:"Hadir",k:""});
return '<div class="ath"><b>'+esc(a.nama)+'</b><div class="seg" role="radiogroup" aria-label="Keterangan '+esc(a.nama)+'">'+
ST.map(function(s){return '<label class="'+s+'"><input type="radio" name="r'+a.id+'" value="'+s+'" data-id="'+a.id+'"'+(c.s===s?" checked":"")+'><span>'+lbl(s)+'</span></label>'}).join("")+
'</div>'+'<textarea class="note" rows="2" data-note="'+a.id+'" placeholder="'+PH[c.s]+'" aria-label="Catatan '+esc(a.nama)+'">'+esc(c.k)+'</textarea>'+'</div>'}).join("")}
$("roster").addEventListener("change",function(e){var id=e.target.dataset.id;if(id){cur[id]=cur[id]||{s:"Hadir",k:""};cur[id].s=e.target.value;renderRoster()}});
$("roster").addEventListener("input",function(e){var id=e.target.dataset.note;if(id)cur[id].k=e.target.value});
$("semua").onclick=function(){db.atlet.forEach(function(a){cur[a.id]={s:"Hadir",k:""}});renderRoster()};

$("tgl").onchange=$("tgl").oninput=function(){$("hari").textContent=tglPanjang($("tgl").value)};
$("pelatih").onchange=function(){db.pelatih=this.value;save()};
$("foto").onchange=function(){
var f=this.files[0];if(!f){foto="";$("prev").hidden=true;return}
var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){
var m=900,w=im.width,h=im.height,s=Math.min(1,m/Math.max(w,h)),c=document.createElement("canvas");
c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
var q=.65;foto=c.toDataURL("image/jpeg",q);while(foto.length>170000&&q>.3){q-=.1;foto=c.toDataURL("image/jpeg",q)}$("prev").src=foto;$("prev").hidden=false};
im.onerror=function(){toast("Foto tidak bisa dibaca.")};im.src=r.result};
r.readAsDataURL(f)};

function resetForm(){cur={};foto="";$("materi").value="";$("evaluasi").value="";$("foto").value="";$("prev").hidden=true;$("tgl").value=today();$("hari").textContent=tglPanjang(today());renderRoster()}
$("reset").onclick=resetForm;
$("simpan").onclick=function(){
var p=$("pelatih").value.trim(),t=$("tgl").value;
if(!p){toast(db.pelatihList.length?"Pilih nama pelatih dulu.":"Tambahkan pelatih di tab Atlet & pelatih.");$("pelatih").focus();return}
if(!t){toast("Pilih tanggal latihan.");return}
if(!db.atlet.length){toast("Tambahkan atlet dulu.");return}
var hadir=db.atlet.map(function(a){var c=cur[a.id]||{s:"Hadir",k:""};return{nama:a.nama,s:c.s,k:c.k}});
var sid=uid(),rec={id:sid,pelatih:p,tgl:t,jm:$("jm").value,js:$("js").value,materi:$("materi").value.trim(),evaluasi:$("evaluasi").value.trim(),hadir:hadir,ts:Date.now()};
db.pelatih=p;save();
var btn=$("simpan"),job;btn.disabled=true;
if(remote&&foto){job=remote.doc("foto/"+sid).set({data:foto}).then(function(){fotoCache[sid]=foto;rec.hasFoto=true;return put("sesi",rec)})}
else{if(!remote)rec.foto=foto;job=put("sesi",rec)}
job.then(function(){toast("Presensi tersimpan.");resetForm();tab("riwayat")},fail).then(function(){btn.disabled=false})};

function hitung(s){var o={Hadir:0,Ijin:0,Sakit:0,Keterangan:0};s.hadir.forEach(function(h){o[h.s]++});return o}
function rekap(s){
var L=["*Presensi Latihan*",tglPanjang(s.tgl)+", "+jam(s.jm)+" - "+jam(s.js),"Pelatih: "+s.pelatih,""];
ST.forEach(function(k){var x=s.hadir.filter(function(h){return h.s===k});
if(x.length)L.push(lbl(k)+" ("+x.length+"): "+x.map(function(h){return h.nama+(h.k?" ("+h.k+")":"")}).join(", "))});
if(s.materi)L.push("","Materi: "+s.materi);
if(s.evaluasi)L.push("","Evaluasi: "+s.evaluasi);
return L.join("\n")}
function renderRiwayat(){
var el=$("v-riwayat"),op={};el.querySelectorAll("details[open]").forEach(function(d){op[d.dataset.id]=1});
if(!db.sesi.length){el.innerHTML='<section><p class="empty">Belum ada presensi. Simpan sesi pertama di tab Catat latihan.</p></section>';return}
el.innerHTML=db.sesi.map(function(s){var c=hitung(s);
return '<details data-id="'+s.id+'"'+(op[s.id]?" open":"")+'><summary><div class="dt">'+esc(tglPanjang(s.tgl))+'</div><div class="mt">'+jam(s.jm)+' - '+jam(s.js)+' &middot; Pelatih '+esc(s.pelatih)+'</div><div class="chips">'+
ST.map(function(k){return c[k]?'<span class="chip c-'+k+'">'+lbl(k)+' '+c[k]+'</span>':''}).join("")+'</div></summary><div class="det">'+
(s.foto?'<img class="prev" src="'+s.foto+'" alt="Foto latihan '+esc(tglPanjang(s.tgl))+'">':(s.hasFoto?'<img class="prev" data-fid="'+s.id+'" alt="Foto latihan '+esc(tglPanjang(s.tgl))+'"'+(fotoCache[s.id]?' src="'+fotoCache[s.id]+'"':' hidden')+'>':''))+
'<h3>Materi latihan</h3><p>'+(esc(s.materi)||'<span class="mt">Tidak diisi</span>')+'</p><h3>Evaluasi</h3><p>'+(esc(s.evaluasi)||'<span class="mt">Tidak diisi</span>')+'</p><h3>Kehadiran</h3><table>'+
s.hadir.map(function(h){return '<tr><td>'+esc(h.nama)+(h.k?'<div class="mt">'+esc(h.k)+'</div>':'')+'</td><td class="c-'+h.s+'">'+lbl(h.s)+'</td></tr>'}).join("")+
'</table><div class="bar" style="margin-top:14px"><button class="btn sm" data-copy="'+s.id+'" type="button">Salin rekap</button><button class="btn ghost sm" data-jpg="'+s.id+'" type="button">Simpan JPG</button><button class="btn bad sm" data-del="'+s.id+'" type="button">Hapus</button></div><textarea class="out" hidden readonly></textarea></div></details>'}).join("");el.querySelectorAll("details[open]").forEach(function(d){ensureFoto(d.dataset.id)})}
$("v-riwayat").addEventListener("toggle",function(e){if(e.target.open&&e.target.dataset.id)ensureFoto(e.target.dataset.id)},true);
$("v-riwayat").addEventListener("click",function(e){
var t=e.target,id=t.dataset.copy||t.dataset.del||t.dataset.jpg;if(!id)return;
var s=db.sesi.filter(function(x){return x.id===id})[0];if(!s)return;
if(t.dataset.jpg){exportJpg(s);return}
if(t.dataset.del){if(t.dataset.sure!=="1"){t.dataset.sure="1";t.textContent="Yakin hapus?";return}
rm("sesi",id).then(function(){toast("Sesi dihapus.")},fail);return}
var txt=rekap(s),ta=t.closest(".det").querySelector("textarea");
ta.value=txt;
(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast("Rekap disalin.")},function(){ta.hidden=false;ta.select();toast("Salin teks di bawah secara manual.")})});

function renderAtlet(){
$("daftar").innerHTML=db.atlet.length?db.atlet.map(function(a){return '<li><span>'+esc(a.nama)+'</span><button class="btn bad sm" data-rm="'+a.id+'" type="button">Hapus</button></li>'}).join(""):'<li class="empty">Belum ada atlet.</li>'}
function tambah(){var n=$("nm").value.trim();if(!n)return;put("atlet",{id:uid(),nama:n,ts:Date.now()}).catch(fail);$("nm").value="";$("nm").focus()}
$("tambah").onclick=tambah;
$("nm").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();tambah()}};
$("daftar").addEventListener("click",function(e){var id=e.target.dataset.rm;if(!id)return;delete cur[id];rm("atlet",id).catch(fail)});

function renderPelatihSel(){var s=$("pelatih"),v=db.pelatih||"";s.innerHTML='<option value="">Pilih pelatih</option>'+db.pelatihList.map(function(p){return '<option value="'+esc(p.nama)+'">'+esc(p.nama)+'</option>'}).join("");s.value=v;if(s.value!==v)s.value=""}
function renderPelatih(){$("daftarP").innerHTML=db.pelatihList.length?db.pelatihList.map(function(p){return '<li><span>'+esc(p.nama)+'</span><button class="btn bad sm" data-rp="'+p.id+'" type="button">Hapus</button></li>'}).join(""):'<li class="empty">Belum ada pelatih.</li>'}
function tambahP(){var n=$("np").value.trim();if(!n)return;put("pelatih",{id:uid(),nama:n,ts:Date.now()}).catch(fail);$("np").value="";$("np").focus()}
$("tambahP").onclick=tambahP;
$("np").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();tambahP()}};
$("daftarP").addEventListener("click",function(e){var id=e.target.dataset.rp;if(!id)return;var p=db.pelatihList.filter(function(x){return x.id===id})[0];if(p&&db.pelatih===p.nama){db.pelatih="";save()}rm("pelatih",id).catch(fail)});

var FN='"Nunito",Arial,sans-serif',FC='"Lilita One","Arial Black",Arial,sans-serif',COL={Hadir:"#1F6B43",Ijin:"#2B5FA8",Sakit:"#B07800",Keterangan:"#6B7280"};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrapT(c,text,maxW){var out=[];String(text||"").split(/\n/).forEach(function(par){if(!par.trim()){out.push("");return}var line="";par.split(/\s+/).forEach(function(w){var t=line?line+" "+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out}
function paint(ctx,s,img,W,draw){
var P=56,CW=W-2*P,y=0;
function T(t,x,yy,f,c,al){if(!draw)return;ctx.font=f;ctx.fillStyle=c;ctx.textAlign=al||"left";ctx.fillText(t,x,yy)}
function H(t){T(t,P,y,"400 38px "+FC,"#E3202B");y+=14;if(draw){ctx.fillStyle="#2B2626";ctx.fillRect(P,y,CW,4)}y+=44}
function B(title,text){y+=24;H(title);ctx.font="400 30px "+FN;wrapT(ctx,text||"-",CW).forEach(function(l){T(l,P,y,"400 30px "+FN,"#17233A");y+=42})}
var lg=$("logo");
if(draw){ctx.fillStyle="#FFF1A8";ctx.fillRect(0,0,W,ctx.canvas.height);ctx.fillStyle="#E3202B";ctx.fillRect(0,0,W,200);ctx.fillStyle="#2B2626";ctx.fillRect(0,200,W,8);
if(lg&&lg.naturalWidth){var lh=176;ctx.drawImage(lg,P,12,lh*lg.naturalWidth/lg.naturalHeight,lh)}
ctx.font="400 52px "+FC;ctx.lineJoin="round";ctx.lineWidth=10;ctx.strokeStyle="#2B2626";ctx.textAlign="left";ctx.strokeText("Presensi Latihan Karateka",P+150,92);ctx.fillStyle="#FFD500";ctx.fillText("Presensi Latihan Karateka",P+150,92)}
T("Arjuna Karate Dojo",P+150,150,"400 44px "+FC,"#FFFFFF");
y=290;
T(tglPanjang(s.tgl),P,y,"700 48px "+FC,"#17233A");y+=46;
T("Pukul "+jam(s.jm)+" - "+jam(s.js),P,y,"500 30px "+FN,"#5B6577");y+=42;
T("Pelatih: "+s.pelatih,P,y,"500 30px "+FN,"#5B6577");y+=36;
var c=hitung(s),x=P;
ST.forEach(function(k){if(!c[k])return;var l=lbl(k)+" "+c[k];ctx.font="600 28px "+FN;var w=ctx.measureText(l).width+36;if(x+w>W-P){x=P;y+=56}
if(draw){ctx.fillStyle=COL[k];rr(ctx,x,y,w,46,23);ctx.fill()}T(l,x+18,y+32,"600 28px "+FN,"#FFFFFF");x+=w+12});
y+=96;
H("Kehadiran");
s.hadir.forEach(function(h){T(h.nama,P,y,"600 30px "+FN,"#17233A");T(lbl(h.s),W-P,y,"700 30px "+FN,COL[h.s],"right");y+=12;
if(h.k){ctx.font="400 26px "+FN;wrapT(ctx,h.k,CW-40).forEach(function(l){y+=34;T(l,P+20,y,"400 26px "+FN,"#5B6577")});y+=10}
y+=34});
B("Materi latihan",s.materi);B("Evaluasi",s.evaluasi);
if(img){y+=24;H("Foto latihan");var r=Math.min(CW/img.width,720/img.height),w=img.width*r,h=img.height*r;if(draw)ctx.drawImage(img,P+(CW-w)/2,y,w,h);y+=h}
return y+P}
function showImg(url){var o=document.createElement("div");o.style.cssText="position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.85);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))";
o.innerHTML='<div style="max-width:560px;margin:0 auto"><p style="color:#fff;margin:0 0 12px">Tekan lama gambar lalu pilih Simpan gambar (HP), atau klik kanan lalu Simpan gambar sebagai (komputer).</p><img alt="Gambar presensi latihan" style="width:100%;border-radius:8px;display:block;background:#fff"><button class="btn" type="button" style="margin-top:12px">Tutup</button></div>';
o.querySelector("img").src=url;o.querySelector("button").onclick=function(){o.remove()};document.body.appendChild(o)}
async function exportJpg(s){
var dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
try{await Promise.all(['400 40px "Lilita One"','600 30px "Nunito"','700 30px "Nunito"'].map(function(f){return document.fonts.load(f)}))}catch(e){}
try{await $("logo").decode()}catch(e){}
var fu=s.foto||(s.hasFoto?await getFoto(s.id):null),img=null;if(fu){img=await new Promise(function(r){var i=new Image();i.onload=function(){r(i)};i.onerror=function(){r(null)};i.src=fu})}
var W=1080,cv=document.createElement("canvas");cv.width=W;cv.height=100;var ctx=cv.getContext("2d");
var h=paint(ctx,s,img,W,false);cv.height=Math.ceil(h);ctx=cv.getContext("2d");paint(ctx,s,img,W,true);
var blob=await new Promise(function(r){cv.toBlob(r,"image/jpeg",.92)});
if(!blob){toast("Gagal membuat gambar.");return}
var fn="Presensi-Latihan-"+s.tgl+".jpg";
if(dl){try{await dl.save({filename:fn,data:blob});toast("Gambar disimpan.");return}catch(e){if(e&&e.code==="declined")return}}
showImg(cv.toDataURL("image/jpeg",.92))}

function dur(s){var a=(s.jm||"").split(":"),b=(s.js||"").split(":"),d=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);return d>0?d:0}
function fmtJam(m){var h=Math.floor(m/60),n=m%60;return(h?h+" jam":"")+(h&&n?" ":"")+(n?n+" mnt":"")||"-"}
function rekapPelatih(ss){var m={};ss.forEach(function(s){var o=m[s.pelatih]||(m[s.pelatih]={nama:s.pelatih,n:0,mnt:0,tg:[]});o.n++;o.mnt+=dur(s);o.tg.push(+s.tgl.slice(8,10))});
return Object.keys(m).map(function(k){m[k].tg.sort(function(a,b){return a-b});return m[k]}).sort(function(a,b){return b.n-a.n||a.nama.localeCompare(b.nama)})}
var rb=null;
function bulanIni(){return today().slice(0,7)}
function namaBulan(m){var p=m.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"})}
function pct(o){return o.n?Math.round(o.Hadir/o.n*100):0}
function dataRekap(m){var ss=db.sesi.filter(function(s){return s.tgl.slice(0,7)===m}),map={};
ss.forEach(function(s){s.hadir.forEach(function(h){var o=map[h.nama]||(map[h.nama]={nama:h.nama,Hadir:0,Ijin:0,Sakit:0,Keterangan:0,n:0});o[h.s]++;o.n++})});
return{ss:ss,rows:Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.nama.localeCompare(b.nama)})}}
function rekapBulan(m){var d=dataRekap(m),L=["*Rekap Presensi Bulanan*","Arjuna Karate Dojo",namaBulan(m),"Jumlah sesi latihan: "+d.ss.length,""];
d.rows.forEach(function(o){L.push(o.nama+": Hadir "+o.Hadir+", Ijin "+o.Ijin+", Sakit "+o.Sakit+", Tanpa Keterangan "+o.Keterangan+" ("+pct(o)+"%)")});L.push("","*Pelatih*");rekapPelatih(d.ss).forEach(function(o){L.push(o.nama+": "+o.n+" sesi ("+fmtJam(o.mnt)+"), tgl "+o.tg.join(", "))});return L.join("\n")}
function renderRekap(){var m=rb||bulanIni(),d=dataRekap(m),tot=0,hd=0;
var h='<section><h2>Rekap bulanan</h2><label class="f">Bulan<input type="month" id="bln" value="'+m+'"></label>';
if(!d.ss.length){h+='<p class="empty">Belum ada sesi latihan pada '+namaBulan(m)+'.</p></section>'}
else{d.rows.forEach(function(o){tot+=o.n;hd+=o.Hadir});
h+='<p class="mt">'+d.ss.length+' sesi latihan pada '+namaBulan(m)+'. Rata-rata kehadiran '+Math.round(hd/tot*100)+'%.</p><div class="tw"><table class="rk"><thead><tr><th>Atlet</th><th>H</th><th>I</th><th>S</th><th>K</th><th>% hadir</th></tr></thead><tbody>'+
d.rows.map(function(o){return '<tr><td>'+esc(o.nama)+'</td><td>'+o.Hadir+'</td><td>'+o.Ijin+'</td><td>'+o.Sakit+'</td><td>'+o.Keterangan+'</td><td>'+pct(o)+'%</td></tr>'}).join("")+
'</tbody></table></div><p class="mt">H = Hadir, I = Ijin, S = Sakit, K = Tanpa Keterangan</p><h3 style="font-size:22px;color:var(--pri);margin:22px 0 8px">Rekap pelatih</h3><div class="tw"><table class="rk rp"><thead><tr><th>Pelatih</th><th>Sesi</th><th>Total jam</th><th style="text-align:left">Tanggal</th></tr></thead><tbody>'+rekapPelatih(d.ss).map(function(o){return '<tr><td>'+esc(o.nama)+'</td><td>'+o.n+'</td><td>'+fmtJam(o.mnt)+'</td><td>'+o.tg.join(", ")+'</td></tr>'}).join("")+'</tbody></table></div><div class="bar" style="margin-top:10px"><button class="btn sm" id="salinR" type="button">Salin rekap bulanan</button></div><textarea class="out" id="outR" hidden readonly></textarea></section>'}
$("v-rekap").innerHTML=h}
$("v-rekap").addEventListener("change",function(e){if(e.target.id==="bln"&&e.target.value){rb=e.target.value;renderRekap()}});
$("v-rekap").addEventListener("click",function(e){if(e.target.id!=="salinR")return;var txt=rekapBulan(rb||bulanIni()),ta=$("outR");ta.value=txt;
(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast("Rekap disalin.")},function(){ta.hidden=false;ta.select();toast("Salin teks di bawah secara manual.")})});

$("tgl").value=today();$("hari").textContent=tglPanjang(today());db.pelatih=readPref();loc=readLoc();if(!db.pelatih&&loc)db.pelatih=loc.pelatih||"";renderPelatihSel();renderRoster();initDb();
})();
